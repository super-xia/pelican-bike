<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · 全新 SVG 动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:24px;
  }
  h1{color:#ffd98a;font-size:clamp(18px,3.6vw,26px);letter-spacing:.16em;font-weight:700}
  .frame{
    width:min(94vw,900px);border-radius:24px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
  }
  svg{display:block;width:100%;height:auto}
  p.tag{color:#8fb3c9;font-size:12px;letter-spacing:.12em}
</style>
</head>
<body>
<h1>🦤 鹈鹕骑车</h1>
<div class="frame">
<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7ea6"/><stop offset=".6" stop-color="#8fd0e8"/><stop offset="1" stop-color="#d9f3f7"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa07a"/><stop offset="1" stop-color="#3c7a5c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6672"/><stop offset="1" stop-color="#3c444d"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7d6"/><stop offset=".6" stop-color="#ffd97a"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe9f0"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#ffcb5e"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7043"/><stop offset="1" stop-color="#e53935"/>
    </linearGradient>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="52" ry="19"/><ellipse cx="-34" cy="7" rx="30" ry="14"/>
      <ellipse cx="36" cy="6" rx="34" ry="15"/><ellipse cx="4" cy="-17" rx="30" ry="17"/>
    </g>
    <g id="tree">
      <rect x="-7" y="-14" width="14" height="40" rx="6" fill="#7a5a3a"/>
      <circle cx="0" cy="-40" r="34" fill="#4e9d63"/>
      <circle cx="-26" cy="-22" r="25" fill="#57ad6e"/>
      <circle cx="27" cy="-24" r="27" fill="#42915a"/>
    </g>
    <g id="wheel">
      <circle r="58" fill="none" stroke="#242b31" stroke-width="11"/>
      <circle r="58" fill="none" stroke="#454f58" stroke-width="3"/>
      <g stroke="#8a97a3" stroke-width="2.6">
        <line x1="-52" y1="0" x2="52" y2="0"/><line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/><line x1="-37" y1="37" x2="37" y2="-37"/>
        <line x1="-20" y1="-48" x2="20" y2="48"/><line x1="-20" y1="48" x2="20" y2="-48"/>
      </g>
      <circle r="8" fill="#4c565f" stroke="#242b31" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="860" height="340" fill="url(#sky)"/>
  <circle cx="716" cy="80" r="78" fill="url(#sun)"/>
  <circle cx="716" cy="80" r="30" fill="#ffeaa0"/>

  <!-- 云：三朵, 循环漂移 -->
  <g fill="#ffffff" opacity=".92">
    <g transform="translate(0 66) scale(.95)">
      <g><animateTransform attributeName="transform" type="translate" values="900;-220;900" dur="34s" repeatCount="indefinite"/>
        <use href="#cloud"/></g>
    </g>
    <g transform="translate(0 132) scale(.62)" opacity=".8">
      <g><animateTransform attributeName="transform" type="translate" values="1000;-260;1000" dur="48s" repeatCount="indefinite"/>
        <use href="#cloud"/></g>
    </g>
    <g transform="translate(0 40) scale(.75)" opacity=".7">
      <g><animateTransform attributeName="transform" type="translate" values="880;-200;880" dur="62s" repeatCount="indefinite"/>
        <use href="#cloud"/></g>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0 300 L150 214 L300 292 L430 208 L560 296 L700 224 L860 300 Z" fill="#6fb3c4" opacity=".75"/>
  <path d="M0 314 L120 262 L250 314 L400 250 L540 314 L680 268 L860 314 Z" fill="url(#hill)" opacity=".95"/>

  <!-- 地面 -->
  <rect y="314" width="860" height="166" fill="#4a9d5f"/>
  <rect y="352" width="860" height="8" fill="#3f8a53" opacity=".6"/>
  <!-- 路 -->
  <rect y="356" width="860" height="76" fill="url(#road)"/>
  <rect y="356" width="860" height="5" fill="#737f8c"/>
  <rect y="427" width="860" height="5" fill="#31383f"/>
  <!-- 路中央虚线 (滚动) -->
  <g fill="#f6f1e0">
    <rect x="0" y="390" width="58" height="11" rx="4"/>
    <rect x="98" y="390" width="58" height="11" rx="4"/>
    <rect x="196" y="390" width="58" height="11" rx="4"/>
    <rect x="294" y="390" width="58" height="11" rx="4"/>
    <rect x="392" y="390" width="58" height="11" rx="4"/>
    <rect x="490" y="390" width="58" height="11" rx="4"/>
    <rect x="588" y="390" width="58" height="11" rx="4"/>
    <rect x="686" y="390" width="58" height="11" rx="4"/>
    <rect x="784" y="390" width="58" height="11" rx="4"/>
    <rect x="882" y="390" width="58" height="11" rx="4"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-98 0" dur="0.6s" repeatCount="indefinite"/>
  </g>
  <!-- 背景树 (滚动, 无缝) -->
  <g>
    <g>
      <use href="#tree" x="70" y="356"/><use href="#tree" x="230" y="356" transform="scale(.85)" transform-origin="230 356"/>
      <use href="#tree" x="390" y="356" transform="scale(1.1)" transform-origin="390 356"/>
      <use href="#tree" x="550" y="356"/><use href="#tree" x="710" y="356" transform="scale(.9)" transform-origin="710 356"/>
      <use href="#tree" x="870" y="356"/><use href="#tree" x="1030" y="356" transform="scale(.85)" transform-origin="1030 356"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity=".55">
    <line x1="200" y1="210" x2="128" y2="210">
      <animate attributeName="opacity" values=".55;.05;.55" dur=".75s" repeatCount="indefinite"/>
    </line>
    <line x1="188" y1="252" x2="104" y2="252">
      <animate attributeName="opacity" values=".08;.6;.08" dur="1.05s" repeatCount="indefinite"/>
    </line>
    <line x1="214" y1="288" x2="152" y2="288">
      <animate attributeName="opacity" values=".4;.06;.4" dur=".9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== 主体：整体轻微起伏 ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 车轮 (后 300 / 前 520, 半径58, 轮心 y=366) -->
    <g transform="translate(300 366)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.65s" repeatCount="indefinite"/>
      <use href="#wheel"/></g></g>
    <g transform="translate(520 366)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.65s" repeatCount="indefinite"/>
      <use href="#wheel"/></g></g>

    <!-- ① 车架 -->
    <g stroke="url(#frameG)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M520 366 L434 274 L300 366"/>
      <path d="M300 366 L352 278"/>
      <path d="M434 274 L434 258"/>
      <path d="M352 278 L282 286"/>
      <path d="M434 258 L352 278"/>
    </g>
    <circle cx="300" cy="366" r="10" fill="#cfd6dd" stroke="#242b31" stroke-width="3"/>
    <circle cx="520" cy="366" r="10" fill="#cfd6dd" stroke="#242b31" stroke-width="3"/>
    <circle cx="434" cy="274" r="10" fill="#cfd6dd" stroke="#242b31" stroke-width="3"/>
    <circle cx="352" cy="278" r="9" fill="#cfd6dd" stroke="#242b31" stroke-width="3"/>
    <!-- 座椅 -->
    <path d="M414 250 Q434 244 454 250 Q446 262 434 262 Q422 262 414 250 Z" fill="#242b31"/>
    <!-- 车把 -->
    <g stroke="#242b31" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M282 286 L268 258"/><path d="M248 254 L288 262"/>
    </g>
    <!-- 后货架 + 行李包 -->
    <g stroke="#242b31" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M520 366 L556 320 L500 316"/>
    </g>
    <g>
      <rect x="486" y="278" width="66" height="44" rx="12" fill="url(#bag)" stroke="#d59a2a" stroke-width="3"/>
      <path d="M486 296 h66" stroke="#d59a2a" stroke-width="3"/>
      <path d="M504 278 q15 -16 30 0" fill="none" stroke="#d59a2a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ② 腿 (曲柄中心 352,278 ; r=46) — 两腿相位差 180° -->
    <g stroke="#3a4149" stroke-width="13" stroke-linecap="round" fill="none">
      <path>
        <animate attributeName="d" values="
          M394 244 L374 320 L398 324;
          M394 244 L350 348 L352 306;
          M394 244 L330 320 L306 324;
          M394 244 L350 348 L352 260;
          M394 244 L374 320 L398 324"
          dur="0.65s" repeatCount="indefinite"/>
      </path>
      <path>
        <animate attributeName="d" values="
          M394 244 L330 320 L306 324;
          M394 244 L350 348 L352 260;
          M394 244 L374 320 L398 324;
          M394 244 L350 348 L352 306;
          M394 244 L330 320 L306 324"
          dur="0.65s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 脚 (animateTransform 驱动, ellipse 不支持 x/y 属性动画) -->
    <g fill="#ff9f43">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="398 324;352 306;306 324;352 354;398 324" dur="0.65s" repeatCount="indefinite"/>
        <ellipse rx="15" ry="8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="306 324;352 354;398 324;352 306;306 324" dur="0.65s" repeatCount="indefinite"/>
        <ellipse rx="15" ry="8"/>
      </g>
    </g>
    <!-- 曲柄 (360°) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.65s" repeatCount="indefinite" additive="sum"/>
      <line x1="352" y1="278" x2="398" y2="278" stroke="#242b31" stroke-width="6" stroke-linecap="round"/>
      <line x1="352" y1="278" x2="306" y2="278" stroke="#242b31" stroke-width="6" stroke-linecap="round"/>
      <circle cx="352" cy="278" r="7" fill="#242b31"/>
    </g>

    <!-- ③ 鹈鹕身体 (起伏跟随) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.6s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M474 216 Q516 194 540 206 Q514 214 512 238 Q492 240 474 228 Z" fill="url(#feather)" stroke="#b8c6d1" stroke-width="2.5"/>
      <!-- 身体 -->
      <ellipse cx="424" cy="208" rx="66" ry="48" fill="url(#feather)" stroke="#b8c6d1" stroke-width="3"/>
      <!-- 翅膀 -->
      <path d="M396 186 Q456 168 492 202 Q488 244 440 250 Q400 244 396 186 Z" fill="#eaf1f7" stroke="#b8c6d1" stroke-width="2.5"/>
      <path d="M414 208 Q440 202 466 210 M410 226 Q440 220 470 228" stroke="#c7d3dd" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- 手(翅)伸向车把 -->
      <path d="M380 212 Q322 224 272 260" stroke="#3a4149" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="268" cy="262" r="9" fill="#3a4149"/>

      <!-- 脖子 -->
      <path d="M384 176 Q338 150 328 100" stroke="#ccd7e0" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M384 176 Q338 150 328 100" stroke="#f3f8fc" stroke-width="21" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="324" cy="90" r="30" fill="url(#feather)" stroke="#b8c6d1" stroke-width="3"/>
      <!-- 头顶羽冠 -->
      <path d="M316 64 Q306 44 322 36 Q326 54 336 50 Q330 62 340 68 Z" fill="#eaf1f7" stroke="#b8c6d1" stroke-width="2" stroke-linejoin="round"/>
      <!-- 眼 -->
      <circle cx="314" cy="82" r="6.5" fill="#242b31"/>
      <circle cx="316.5" cy="79.5" r="2.4" fill="#ffffff"/>
      <!-- 大喙 -->
      <path d="M302 92 Q226 86 178 118 Q236 132 296 112 Z" fill="#ffb74d" stroke="#ef8f22" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M296 112 Q236 132 178 118" fill="none" stroke="#ef8f22" stroke-width="2"/>
      <!-- 嗉囊 (呼吸伸缩) -->
      <path d="M236 122 Q224 172 258 182 Q280 160 272 124 Z" fill="#ffcf6b" stroke="#ef8f22" stroke-width="2.5" stroke-linejoin="round">
        <animate attributeName="d" values="
          M236 122 Q224 172 258 182 Q280 160 272 124 Z;
          M236 122 Q228 196 262 204 Q284 164 272 124 Z;
          M236 122 Q224 172 258 182 Q280 160 272 124 Z"
          dur="1.2s" repeatCount="indefinite"/>
      </path>
      <!-- 腮红 -->
      <ellipse cx="344" cy="102" rx="10" ry="6" fill="#ff9d9d" opacity=".55"/>
    </g>
  </g>

  <!-- 前景草 (快速掠过) -->
  <g fill="#2e7d43">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-170 0" dur="0.42s" repeatCount="indefinite"/>
      <path d="M0 436 q11 -30 22 0 z"/><path d="M48 436 q13 -36 26 0 z"/><path d="M104 436 q10 -26 20 0 z"/>
      <path d="M156 436 q12 -32 24 0 z"/><path d="M214 436 q14 -38 28 0 z"/><path d="M280 436 q11 -28 22 0 z"/>
      <path d="M336 436 q12 -34 24 0 z"/><path d="M396 436 q13 -36 26 0 z"/><path d="M458 436 q10 -26 20 0 z"/>
      <path d="M512 436 q12 -32 24 0 z"/><path d="M574 436 q14 -38 28 0 z"/><path d="M640 436 q11 -28 22 0 z"/>
      <path d="M700 436 q12 -34 24 0 z"/><path d="M760 436 q13 -36 26 0 z"/><path d="M822 436 q10 -26 20 0 z"/>
      <path d="M876 436 q12 -32 24 0 z"/><path d="M938 436 q14 -38 28 0 z"/><path d="M1004 436 q11 -28 22 0 z"/>
    </g>
  </g>
</svg>
</div>
<p class="tag">纯 SVG · SMIL 动画 · 零 JavaScript · 零依赖</p>
</body>
</html>
