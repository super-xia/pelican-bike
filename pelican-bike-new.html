<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #16324f, #081421 70%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .stage {
    width: min(94vw, 880px);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }
  h1 {
    color: #cfe4f7; font-size: clamp(17px, 3.4vw, 24px);
    letter-spacing: .18em; margin-bottom: 16px; font-weight: 600;
  }
  h1 span { color: #ffd479; }
  .hint { color: #6c8aa5; font-size: 12px; margin-top: 14px; letter-spacing: .08em; }
</style>
</head>
<body>
<h1>鹈鹕骑车 · <span>Pelican on a Bike</span></h1>

<div class="stage">
<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9d6"/>
      <stop offset=".55" stop-color="#8ecbe6"/>
      <stop offset="1" stop-color="#dff1f7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fbf52"/>
      <stop offset="1" stop-color="#3f8f39"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#d6dee6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#ffd873"/>
      <stop offset="1" stop-color="#ffd873" stop-opacity="0"/>
    </radialGradient>

    <!-- 云 -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="17" fill="#ffffff"/>
      <ellipse cx="-28" cy="6" rx="26" ry="12" fill="#ffffff"/>
      <ellipse cx="30" cy="5" rx="30" ry="13" fill="#ffffff"/>
      <ellipse cx="4" cy="-14" rx="26" ry="14" fill="#ffffff"/>
    </g>
    <!-- 远处小房子 -->
    <g id="house">
      <rect x="-26" y="-20" width="52" height="24" rx="2" fill="#f2e6d2" stroke="#c8b693" stroke-width="1.5"/>
      <path d="M-32 -20 L0 -42 L32 -20 Z" fill="#d96a4a" stroke="#b34f34" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="-9" y="-8" width="14" height="12" rx="1.5" fill="#8a6b46"/>
    </g>
    <!-- 树 -->
    <g id="tree">
      <rect x="-6" y="-10" width="12" height="34" rx="4" fill="#8a6b46"/>
      <circle cx="0" cy="-34" r="30" fill="#57a84f"/>
      <circle cx="-22" cy="-20" r="22" fill="#63b45a"/>
      <circle cx="22" cy="-22" r="24" fill="#4f9c48"/>
    </g>
    <!-- 车轮（辐条在内部，旋转靠外层 group） -->
    <g id="wheel">
      <circle r="54" fill="none" stroke="#2f3a44" stroke-width="9"/>
      <circle r="54" fill="none" stroke="#596774" stroke-width="3"/>
      <g stroke="#9aa8b4" stroke-width="2.4">
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
      </g>
      <circle r="7" fill="#4a5762" stroke="#2f3a44" stroke-width="2"/>
    </g>
  </defs>

  <!-- 天空 / 太阳 -->
  <rect width="800" height="330" fill="url(#sky)"/>
  <circle cx="672" cy="78" r="70" fill="url(#sun)"/>
  <circle cx="672" cy="78" r="26" fill="#ffe9a8"/>

  <!-- 远山 -->
  <path d="M0 300 L120 232 L232 288 L340 226 L470 300 Z" fill="#9fc2cf" opacity=".85"/>
  <path d="M330 300 L470 214 L600 286 L712 232 L800 300 Z" fill="#7fb0bf" opacity=".9"/>

  <!-- 云（漂移） -->
  <g opacity=".95">
    <g transform="translate(0 0) scale(.9)">
      <use href="#cloud" x="0" y="70">
        <animate attributeName="x" values="800;-160;800" dur="38s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="scale(.62)" opacity=".9">
      <use href="#cloud" x="0" y="150">
        <animate attributeName="x" values="1400;-260;1400" dur="52s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="scale(1.15)" opacity=".8">
      <use href="#cloud" x="0" y="58">
        <animate attributeName="x" values="760;-140;760" dur="64s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- 地 -->
  <rect y="300" width="800" height="160" fill="url(#grass)"/>
  <!-- 路 -->
  <rect y="332" width="800" height="70" fill="#464f59"/>
  <rect y="332" width="800" height="4" fill="#5b646e"/>
  <rect y="398" width="800" height="4" fill="#3a424b"/>
  <!-- 路面虚线（向左滚动 = 前进） -->
  <g fill="#f4f1e4">
    <rect x="0" y="362" width="52" height="10" rx="3"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(100 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(200 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(300 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(400 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(500 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(600 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(700 0)"/>
    <rect x="0" y="362" width="52" height="10" rx="3" transform="translate(800 0)"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-100 0" dur="0.55s" repeatCount="indefinite"/>
  </g>

  <!-- 背景房子树（固定，缓慢横向漂移制造景深） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-200 0" dur="6s" repeatCount="indefinite"/>
    <use href="#tree" transform="translate(60 332)"/>
    <use href="#house" transform="translate(210 332)"/>
    <use href="#tree" transform="translate(360 332) scale(.8)"/>
    <use href="#tree" transform="translate(500 332) scale(1.1)"/>
    <use href="#house" transform="translate(640 332)"/>
    <use href="#tree" transform="translate(780 332)"/>
    <!-- 复制一份实现无缝循环 -->
    <use href="#tree" transform="translate(860 332)"/>
    <use href="#house" transform="translate(1010 332)"/>
    <use href="#tree" transform="translate(1160 332) scale(.8)"/>
    <use href="#tree" transform="translate(1300 332) scale(1.1)"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".5">
    <line x1="180" y1="205" x2="120" y2="205">
      <animate attributeName="opacity" values=".5;.05;.5" dur=".8s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="245" x2="90" y2="245">
      <animate attributeName="opacity" values=".1;.5;.1" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== 鹈鹕 + 单车（整体上下轻微浮动） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -3.5;0 0" dur="0.55s" repeatCount="indefinite"/>

    <!-- ① 身体(最先画, 腿在其上) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -2.5;0 0" dur="0.55s" repeatCount="indefinite"/>
      <!-- 尾巴 -->
      <path d="M432 208 Q470 186 490 196 Q468 202 466 224 Q448 226 432 218 Z" fill="url(#body)" stroke="#b9c4cd" stroke-width="2"/>
      <ellipse cx="392" cy="204" rx="60" ry="44" fill="url(#body)" stroke="#b9c4cd" stroke-width="2.5"/>
      <path d="M368 186 Q420 168 452 196 Q450 232 408 240 Q372 234 368 186 Z" fill="#e7edf2" stroke="#b9c4cd" stroke-width="2"/>
      <path d="M384 206 Q404 200 424 208 M382 220 Q404 214 426 222" stroke="#c3ced7" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 手臂伸向车把 -->
      <path d="M356 208 Q316 218 272 254" stroke="#3a4149" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- 脖子 -->
      <path d="M352 178 Q312 152 306 108" stroke="#c9d3dc" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="M352 178 Q312 152 306 108" stroke="#eef3f7" stroke-width="18" fill="none" stroke-linecap="round"/>
      <circle cx="304" cy="98" r="27" fill="url(#body)" stroke="#b9c4cd" stroke-width="2.5"/>
      <path d="M298 74 Q292 58 304 52 Q306 66 314 64 Q310 74 318 78 Z" fill="#e7edf2" stroke="#b9c4cd" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="296" cy="92" r="5.5" fill="#2f3a44"/>
      <circle cx="298" cy="90" r="2" fill="#ffffff"/>
      <!-- 大喙 + 嗉囊(呼吸伸缩) -->
      <path d="M282 100 Q214 96 172 122 Q220 132 272 118 Z" fill="#ffb04a" stroke="#e08a24" stroke-width="2" stroke-linejoin="round"/>
      <path d="M232 120 Q222 162 250 170 Q268 152 262 122 Z" fill="#ffc46b" stroke="#e08a24" stroke-width="2" stroke-linejoin="round">
        <animate attributeName="d" values="
          M232 120 Q222 162 250 170 Q268 152 262 122 Z;
          M232 120 Q226 180 252 184 Q270 154 262 122 Z;
          M232 120 Q222 162 250 170 Q268 152 262 122 Z"
          dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M276 108 Q224 106 182 122" stroke="#e08a24" stroke-width="1.6" fill="none"/>
      <ellipse cx="316" cy="108" rx="9" ry="5" fill="#ffb3b3" opacity=".55"/>
    </g>

    <!-- ② 车轮 -->
    <g transform="translate(280 340)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(480 340)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- ③ 车架 + 座椅 + 车把 -->
    <g stroke="#e04a3a" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M480 340 L398 250 L280 340"/>
      <path d="M280 340 L330 254"/>
      <path d="M398 250 L398 234"/>
      <path d="M330 254 L262 262"/>
    </g>
    <circle cx="280" cy="340" r="9" fill="#c9ccd2" stroke="#2f3a44" stroke-width="2.5"/>
    <circle cx="480" cy="340" r="9" fill="#c9ccd2" stroke="#2f3a44" stroke-width="2.5"/>
    <circle cx="398" cy="250" r="9" fill="#c9ccd2" stroke="#2f3a44" stroke-width="2.5"/>
    <rect x="380" y="222" width="40" height="12" rx="6" fill="#2f3a44"/>
    <rect x="252" y="248" width="26" height="9" rx="4.5" fill="#2f3a44" transform="rotate(6 265 252)"/>

    <!-- ④ 腿（最上层）: 胯点在车身下方车身轮廓外, 左右腿相位差 180° -->
    <g stroke="#3a4149" stroke-width="12" stroke-linecap="round" fill="none">
      <path>
        <animate attributeName="d" values="
          M362 254 L322 282 L295 302;
          M362 254 L316 324 L281 351;
          M362 254 L320 326 L265 302;
          M362 254 L316 324 L279 253;
          M362 254 L322 282 L295 302"
          dur="0.8s" repeatCount="indefinite"/>
      </path>
      <path>
        <animate attributeName="d" values="
          M362 254 L320 326 L265 302;
          M362 254 L316 324 L279 253;
          M362 254 L322 282 L295 302;
          M362 254 L316 324 L281 351;
          M362 254 L320 326 L265 302"
          dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- ⑤ 踏板 -->
    <g stroke="#2f3a44" stroke-width="8" stroke-linecap="round">
      <line x1="280" y1="302">
        <animate attributeName="x2" values="295;281;265;279;295" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;351;302;253;302" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="280" y1="302">
        <animate attributeName="x2" values="265;279;295;281;265" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="302;253;302;351;302" dur="0.8s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- 前景草丛（快速滚过，强化速度） -->
  <g fill="#2f7d33">
    <path d="M0 402 q10 -26 20 0 z">
      <animate attributeName="x" values="0;0" dur=".6s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="0.4s" repeatCount="indefinite"/>
    <g>
      <path d="M0 404 q9 -24 18 0 z"/>
      <path d="M50 404 q11 -30 22 0 z"/>
      <path d="M110 404 q8 -20 16 0 z"/>
      <path d="M170 404 q10 -26 20 0 z"/>
      <path d="M230 404 q12 -32 24 0 z"/>
      <path d="M300 404 q9 -22 18 0 z"/>
      <path d="M360 404 q10 -28 20 0 z"/>
      <path d="M430 404 q11 -30 22 0 z"/>
      <path d="M500 404 q8 -20 16 0 z"/>
      <path d="M560 404 q10 -26 20 0 z"/>
      <path d="M630 404 q12 -32 24 0 z"/>
      <path d="M700 404 q9 -22 18 0 z"/>
      <path d="M760 404 q10 -28 20 0 z"/>
      <path d="M830 404 q11 -30 22 0 z"/>
      <path d="M900 404 q8 -20 16 0 z"/>
      <path d="M960 404 q10 -26 20 0 z"/>
    </g>
  </g>
</svg>
</div>

<div class="hint">纯 SVG · SMIL 动画 · 无 JavaScript · 无外部依赖</div>
</body>
</html>
