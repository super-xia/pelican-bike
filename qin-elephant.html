<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秦始皇骑象图 · SVG 动画</title>
<style>
:root{
  --ink:#332b22; --gold:#b8903f;
  /* 动画时长（秒），由 JS 的倍速控件整体缩放 */
  --bob:.55s; --sway:1.1s; --half:.55s; --stride:1.1s; --ear:1.1s;
  --trunk:1.1s; --tail:.8s; --bead:.55s; --flag:1.6s;
  --drift-slow:46s; --drift-fast:7s; --dust:1.1s; --bird:1.4s; --rays:80s;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#d9cbb0;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(10px,3vw,32px);
}
.frame{
  position:relative;width:min(1120px,100%);aspect-ratio:16/9;
  background:#f6ecd8;border:1px solid #b6a27a;
  box-shadow:0 20px 55px rgba(60,44,22,.24), inset 0 0 0 9px rgba(184,144,63,.10);
  overflow:hidden;
}
svg{display:block;width:100%;height:100%}

/* 题跋与钤印 */
.caption{position:absolute;left:clamp(14px,3%,34px);bottom:clamp(12px,4%,30px);display:flex;align-items:center;gap:12px;pointer-events:none}
.seal{
  width:clamp(30px,4.2vw,46px);height:clamp(30px,4.2vw,46px);
  background:#9b3327;color:#f8ead0;border:2px solid #7d281e;border-radius:4px;
  display:grid;place-items:center;
  font-family:"Songti SC","STSong","SimSun",serif;font-weight:700;
  font-size:clamp(17px,2.5vw,27px);line-height:1;
  transform:rotate(-4deg);box-shadow:1px 2px 0 rgba(80,30,20,.25);
}
.caption h1{margin:0;font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:clamp(16px,2.6vw,29px);font-weight:700;letter-spacing:.14em}
.caption p{margin:3px 0 0;font-size:clamp(9px,1.15vw,12px);letter-spacing:.3em;color:#8a785c}

/* 控制条 */
.tweaks{
  position:absolute;right:clamp(12px,2.5%,26px);bottom:clamp(12px,4%,28px);
  display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(250,242,225,.86);border:1px solid #c3ae83;border-radius:999px;
  backdrop-filter:blur(4px);
}
.tweaks button{
  min-height:36px;padding:0 13px;border:0;border-radius:999px;
  background:transparent;color:#5c4c34;cursor:pointer;
  font-size:13px;font-family:inherit;letter-spacing:.04em;
  transition:background .18s,color .18s;
}
.tweaks button:hover{background:rgba(155,51,39,.10)}
.tweaks button.on{background:#332b22;color:#f6ecd8}
.tweaks button:focus-visible{outline:2px solid #9b3327;outline-offset:2px}
.tweaks .sep{width:1px;height:20px;background:#c9b691;margin:0 3px}

/* 关键帧 */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes stride{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes ear{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes trunk{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes tail{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}
@keyframes bead{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes flag{0%,100%{transform:skewY(-3deg) scaleX(.97)}50%{transform:skewY(3.5deg) scaleX(1.03)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-960px)}}
@keyframes dust{0%{transform:translate(0,0);opacity:0}25%{opacity:.65}100%{transform:translate(-70px,-26px);opacity:0}}
@keyframes halo{0%,100%{opacity:.32;transform:scale(1)}50%{opacity:.6;transform:scale(1.06)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes bird{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}

/* 动画绑定（时长全部用具体字面量，避免 calc(var()) 兼容坑） */
#parade{animation:bob var(--bob) ease-in-out infinite}
#elephant{transform-box:view-box;transform-origin:450px 320px;animation:sway var(--sway) ease-in-out infinite}
.leg{transform-box:view-box;animation:stride var(--stride) ease-in-out infinite}
.leg.b{animation-delay:calc(-1 * var(--half))}
#ear{transform-box:view-box;transform-origin:590px 246px;animation:ear var(--ear) ease-in-out infinite}
#trunk{transform-box:view-box;transform-origin:678px 302px;animation:trunk var(--trunk) ease-in-out infinite}
#tail{transform-box:view-box;transform-origin:300px 288px;animation:tail var(--tail) ease-in-out infinite}
#beads{transform-box:view-box;transform-origin:414px 120px;animation:bead var(--bead) ease-in-out infinite}
#flagcloth{transform-box:view-box;transform-origin:336px 100px;animation:flag var(--flag) ease-in-out infinite}
.drift-slow{animation:drift var(--drift-slow) linear infinite}
.drift-fast{animation:drift var(--drift-fast) linear infinite}
.dust{animation:dust var(--dust) ease-out infinite}
.dust.d1{animation-delay:calc(-.35 * var(--dust))}
.dust.d2{animation-delay:calc(-.55 * var(--dust))}
.dust.d3{animation-delay:calc(-.8 * var(--dust))}
#halo{transform-box:view-box;transform-origin:790px 104px;animation:halo 5s ease-in-out infinite}
#rays{transform-box:view-box;transform-origin:790px 104px;animation:spin var(--rays) linear infinite}
.bird{animation:bird var(--bird) ease-in-out infinite}
.bird.b2{animation-delay:calc(-.5 * var(--bird))}
#sun{animation:glow 5s ease-in-out infinite}

#stage.paused *,.reduced *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){#stage *{animation-play-state:paused!important}}
</style>
</head>

<div class="caption">
  <div class="seal">秦</div>
  <div><h1>秦始皇骑象图</h1><p>巡狩 · 动态 SVG</p></div>
</div>

<div class="tweaks" role="group" aria-label="动画控制">
  <button id="play" type="button">暂停</button>
  <span class="sep"></span>
  <button type="button" data-sf="2">0.5×</button>
  <button type="button" data-sf="1" class="on">1×</button>
  <button type="button" data-sf="0.5">2×</button>
</div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var play=document.getElementById('play');
  var root=document.documentElement;
  var base={
    bob:.55,sway:1.1,half:.55,stride:1.1,ear:1.1,trunk:1.1,tail:.8,
    bead:.55,flag:1.6,'drift-slow':46,'drift-fast':7,dust:1.1,bird:1.4,rays:80
  };
  function setSpeed(f){
    Object.keys(base).forEach(function(k){
      root.style.setProperty('--'+k,(base[k]*f).toFixed(3)+'s');
    });
  }
  play.addEventListener('click',function(){
    stage.classList.toggle('paused');
    play.textContent=stage.classList.contains('paused')?'继续':'暂停';
  });
  var speedBtns=document.querySelectorAll('[data-sf]');
  speedBtns.forEach(function(b){
    b.addEventListener('click',function(){
      setSpeed(parseFloat(b.dataset.sf));
      speedBtns.forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
    });
  });
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    stage.classList.add('reduced');play.textContent='继续';
  }
})();
</script>
</body>
</html>
