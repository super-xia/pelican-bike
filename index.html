<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#1a3a5c, #0d1f33);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .stage {
    width: min(92vw, 860px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    background: #fff;
  }
  svg { display: block; width: 100%; height: auto; }
  .bar {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    border: none;
    background: #f5b841;
    color: #3a2405;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,184,65,.4); }
  button.ghost { background: rgba(255,255,255,.15); color: #fff; }
  .hint { color: #9fb3c8; font-size: 13px; }
</style>
</head>
<body>
  <div class="stage">
    <svg id="scene" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7ec8f2"/>
          <stop offset="0.7" stop-color="#c9ecfb"/>
          <stop offset="1" stop-color="#eaf8ff"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5a6472"/>
          <stop offset="1" stop-color="#454e5c"/>
        </linearGradient>
        <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffe98a"/>
          <stop offset="1" stop-color="#ffd34d"/>
        </radialGradient>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="800" height="470" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g>
        <circle cx="680" cy="100" r="70" fill="#fff2b0" opacity="0.35">
          <animate attributeName="r" values="64;74;64" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="680" cy="100" r="44" fill="url(#sunG)">
          <animate attributeName="r" values="42;46;42" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- 云朵 1 -->
      <g fill="#ffffff" opacity="0.95">
        <animateTransform attributeName="transform" type="translate" values="0,0;80,0;0,0" dur="22s" repeatCount="indefinite"/>
        <ellipse cx="150" cy="90" rx="52" ry="26"/>
        <ellipse cx="195" cy="76" rx="38" ry="22"/>
        <ellipse cx="112" cy="80" rx="32" ry="20"/>
      </g>
      <!-- 云朵 2 -->
      <g fill="#ffffff" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0;60,0;0,0" dur="30s" repeatCount="indefinite"/>
        <ellipse cx="440" cy="140" rx="60" ry="28"/>
        <ellipse cx="490" cy="126" rx="40" ry="22"/>
      </g>
      <!-- 云朵 3 -->
      <g fill="#ffffff" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0,0;-70,0;0,0" dur="26s" repeatCount="indefinite"/>
        <ellipse cx="620" cy="70" rx="46" ry="22"/>
        <ellipse cx="660" cy="58" rx="34" ry="18"/>
      </g>

      <!-- 远山 -->
      <path d="M0 470 L120 380 L240 470 Z" fill="#a8d5a2"/>
      <path d="M180 470 L340 350 L500 470 Z" fill="#93c98c"/>
      <path d="M420 470 L600 370 L800 470 Z" fill="#a8d5a2"/>

      <!-- 草地 -->
      <rect x="0" y="470" width="800" height="90" fill="#7cc46e"/>

      <!-- 公路 -->
      <rect x="0" y="500" width="800" height="60" fill="url(#road)"/>
      <!-- 移动的公路虚线 -->
      <g stroke="#f4f6f8" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0,0;-160,0" dur="0.8s" repeatCount="indefinite"/>
        <line x1="40" y1="530" x2="90" y2="530"/>
        <line x1="160" y1="530" x2="210" y2="530"/>
        <line x1="280" y1="530" x2="330" y2="530"/>
        <line x1="400" y1="530" x2="450" y2="530"/>
        <line x1="520" y1="530" x2="570" y2="530"/>
        <line x1="640" y1="530" x2="690" y2="530"/>
        <line x1="760" y1="530" x2="810" y2="530"/>
        <line x1="880" y1="530" x2="930" y2="530"/>
      </g>

      <!-- 小花点缀 -->
      <g>
        <circle cx="60" cy="480" r="5" fill="#ff8fb3"/>
        <circle cx="60" cy="480" r="2" fill="#fff"/>
        <circle cx="740" cy="488" r="5" fill="#ffd166"/>
        <circle cx="740" cy="488" r="2" fill="#fff"/>
      </g>

      <!-- ============ 自行车 ============ -->
      <g id="bike">
        <!-- 车架 -->
        <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
          <!-- 下管：中轴 → 车把 -->
          <line x1="330" y1="460" x2="470" y2="370"/>
          <!-- 上管：座垫 → 车把 -->
          <line x1="300" y1="350" x2="470" y2="370"/>
          <!-- 座管：中轴 → 座垫 -->
          <line x1="330" y1="460" x2="300" y2="350"/>
          <!-- 后下叉：中轴 → 后轮 -->
          <line x1="330" y1="460" x2="250" y2="460"/>
          <!-- 前叉：车把 → 前轮 -->
          <line x1="470" y1="370" x2="495" y2="460"/>
          <!-- 座垫 -->
          <line x1="290" y1="345" x2="315" y2="345" stroke-width="9"/>
        </g>
        <!-- 车把 -->
        <path d="M470 370 q0 -16 16 -16" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>

        <!-- 后轮 -->
        <g>
          <circle cx="250" cy="460" r="48" fill="none" stroke="#333" stroke-width="5"/>
          <circle cx="250" cy="460" r="6" fill="#333"/>
          <g stroke="#999" stroke-width="2">
            <line x1="250" y1="412" x2="250" y2="508"/>
            <line x1="202" y1="460" x2="298" y2="460"/>
            <line x1="216" y1="426" x2="284" y2="494"/>
            <line x1="284" y1="426" x2="216" y2="494"/>
          </g>
          <animateTransform attributeName="transform" type="rotate" from="0 250 460" to="360 250 460" dur="1.1s" repeatCount="indefinite"/>
        </g>

        <!-- 前轮 -->
        <g>
          <circle cx="495" cy="460" r="48" fill="none" stroke="#333" stroke-width="5"/>
          <circle cx="495" cy="460" r="6" fill="#333"/>
          <g stroke="#999" stroke-width="2">
            <line x1="495" y1="412" x2="495" y2="508"/>
            <line x1="447" y1="460" x2="543" y2="460"/>
            <line x1="461" y1="426" x2="529" y2="494"/>
            <line x1="529" y1="426" x2="461" y2="494"/>
          </g>
          <animateTransform attributeName="transform" type="rotate" from="0 495 460" to="360 495 460" dur="1.1s" repeatCount="indefinite"/>
        </g>

        <!-- 牙盘 + 曲柄 + 脚踏 -->
        <g>
          <circle cx="330" cy="460" r="16" fill="#333"/>
          <circle cx="330" cy="460" r="6" fill="#fff"/>
          <animateTransform attributeName="transform" type="rotate" from="0 330 460" to="360 330 460" dur="1.1s" repeatCount="indefinite"/>
        </g>
        <!-- 曲柄 1（右）与脚踏 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 330 460" to="360 330 460" dur="1.1s" repeatCount="indefinite"/>
          <line x1="330" y1="460" x2="330" y2="486" stroke="#333" stroke-width="5" stroke-linecap="round"/>
          <rect x="322" y="484" width="16" height="7" rx="2" fill="#333"/>
        </g>
        <!-- 曲柄 2（左）与脚踏 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180 330 460" to="540 330 460" dur="1.1s" repeatCount="indefinite"/>
          <line x1="330" y1="460" x2="330" y2="486" stroke="#333" stroke-width="5" stroke-linecap="round"/>
          <rect x="322" y="484" width="16" height="7" rx="2" fill="#333"/>
        </g>
        <!-- 链条 -->
        <g stroke="#555" stroke-width="3" fill="none">
          <line x1="330" y1="444" x2="250" y2="444"/>
          <line x1="330" y1="476" x2="250" y2="476"/>
        </g>
      </g>

      <!-- ============ 鹈鹕 ============ -->
      <g id="pelican">
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="1.1s" repeatCount="indefinite"/>

        <!-- 尾巴 -->
        <g>
          <path d="M250 300 q-28 6 -40 20 l12 8 q10 -12 30 -14 Z" fill="#dbe4ea">
            <animateTransform attributeName="transform" type="rotate" values="0 250 300;-8 250 300;0 250 300" dur="1.1s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- 身体 -->
        <ellipse cx="305" cy="295" rx="58" ry="44" fill="#f7f9fb"/>
        <ellipse cx="305" cy="305" rx="52" ry="34" fill="#eef3f7"/>

        <!-- 翅膀 -->
        <g>
          <path d="M285 285 q-20 -6 -34 6 q-14 12 -8 22 q16 -10 44 -8 Z" fill="#dfe8ef">
            <animateTransform attributeName="transform" type="rotate" values="0 285 290;10 285 290;0 285 290" dur="1.1s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- 脖子 -->
        <path d="M340 280 q14 -22 10 -40" stroke="#f7f9fb" stroke-width="20" fill="none" stroke-linecap="round"/>

        <!-- 头 -->
        <circle cx="360" cy="230" r="26" fill="#f7f9fb"/>

        <!-- 喙（黄色大嘴 + 喉囊） -->
        <g>
          <!-- 上喙 -->
          <path d="M382 226 L440 234 L384 240 Z" fill="#f7b733"/>
          <!-- 下喙喉囊 -->
          <path d="M384 240 L440 234 Q420 262 392 256 Z" fill="#f2a32b"/>
        </g>

        <!-- 眼睛 -->
        <circle cx="372" cy="224" r="4.5" fill="#1f2733"/>
        <circle cx="374" cy="222" r="1.5" fill="#fff"/>

        <!-- 腿 1（左腿，蹬踏） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 330 340;-18 330 340;0 330 340" dur="1.1s" repeatCount="indefinite"/>
          <path d="M330 340 q-4 30 0 60 q2 18 6 30" stroke="#f2a32b" stroke-width="7" fill="none" stroke-linecap="round"/>
          <!-- 脚 -->
          <path d="M334 428 l-10 8 l14 6 l12 -4 Z" fill="#f2a32b"/>
        </g>
        <!-- 腿 2（右腿，蹬踏，相位相反） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 330 340;18 330 340;0 330 340" dur="1.1s" repeatCount="indefinite"/>
          <path d="M318 342 q-4 28 2 56 q4 20 4 34" stroke="#e89220" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M324 430 l-10 8 l14 6 l12 -4 Z" fill="#e89220"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <button id="toggleBtn">⏸ 暂停</button>
    <button id="copyBtn" class="ghost">复制 SVG 代码</button>
    <span class="hint">纯 SVG 动画 · 无需依赖</span>
  </div>

  <script>
    const svg = document.getElementById('scene');
    const btn = document.getElementById('toggleBtn');
    let paused = false;
    btn.addEventListener('click', () => {
      paused = !paused;
      if (paused) { svg.pauseAnimations(); btn.textContent = '▶ 播放'; }
      else { svg.unpauseAnimations(); btn.textContent = '⏸ 暂停'; }
    });
    document.getElementById('copyBtn').addEventListener('click', () => {
      const s = document.getElementById('scene').outerHTML;
      navigator.clipboard.writeText(s).then(() => alert('SVG 代码已复制'));
    });
  </script>
</body>
</html>
